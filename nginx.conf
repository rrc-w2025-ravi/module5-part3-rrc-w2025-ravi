worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Transactions JavaScript microservice
        location = /api/transactions {
            proxy_pass http://transactions:3000/api/transactions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/transactions/ {
            proxy_pass http://transactions:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Banking backend
        location ~ ^/(api|deposit|withdraw|login|register|dashboard|logout) {
            set $backend_service http://backend:5000;
            proxy_pass $backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Student portfolio frontend
        location / {
            set $frontend_service http://frontend:80;
            proxy_pass $frontend_service;
            proxy_set_header Host $host;
        }
    }
}