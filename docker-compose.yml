
services:
  # MongoDB database
  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db

  # Python Flask backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
      - SECRET_KEY=supersecretkey
    depends_on:
      - mongo

  # JavaScript transactions service
  transactions:
    build:
      context: ./transactions
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - PORT=3000
    depends_on:
      - mongo

  # Student portfolio frontend
  frontend:
    build:
      context: ./studentportfolio
      dockerfile: Dockerfile

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - transactions
      - frontend

volumes:
  mongo_data:
